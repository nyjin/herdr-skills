name: Skills check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify skills repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every check lives in scripts/check.sh, so it runs the same way locally: scripts/check.sh [name ...]
      - name: Ensure gh >= 2.90.0
        run: scripts/ensure-gh.sh

      - name: Validate skill spec (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check.sh skill-spec

      - name: SKILL.md name matches directory
        run: scripts/check.sh names

      - name: README skills tables match skills/
        run: scripts/check.sh readme

      - name: Validate plugin manifests
        run: scripts/check.sh manifests

      - name: finalize-brief.py smoke test
        run: scripts/check.sh finalize-brief

      - name: Hooks smoke test
        run: scripts/check.sh hooks

      - name: runs.py smoke test
        run: scripts/check.sh runs

      - name: Unit tests
        run: scripts/check.sh unit
