name: Skills check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Verify skills repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Every check lives in scripts/check.sh, so it runs the same way locally: scripts/check.sh [name ...]
      - name: Ensure gh >= 2.90.0
        run: scripts/ensure-gh.sh

      - name: Validate skill spec (gh skill publish --dry-run)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/check.sh skill-spec

      - name: SKILL.md name matches directory
        run: scripts/check.sh names

      - name: README tables match skills/ and herdr-plugins/
        run: scripts/check.sh readme

      - name: English outside .ko.md files and tests
        run: scripts/check.sh language

      - name: finalize-brief.py smoke test
        run: scripts/check.sh finalize-brief

      - name: Hooks smoke test
        run: scripts/check.sh hooks

      - name: runs.py smoke test
        run: scripts/check.sh runs

      - name: release.sh version decision
        run: scripts/check.sh release

      - name: Unit tests
        run: scripts/check.sh unit

  # A push to main that passed the checks publishes a release when the commits since the last v<semver> tag changed
  # skills/; their Conventional Commit types set the bump (scripts/release.sh). Other pushes publish nothing.
  release:
    name: Publish a skills release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Two pushes in a row must not both compute and publish the same next version.
    concurrency:
      group: skills-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history and every tag: release.sh compares HEAD with the last release tag

      - name: Ensure gh >= 2.90.0
        run: scripts/ensure-gh.sh

      - name: Publish a release if skills/ changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/release.sh
