[package]
name = "peek"
version = "0.6.0"
edition = "2021"
description = "herdr plugin: show a clicked or selected file or link, rendered by WebKit, in the pane beside it"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.12", default-features = false, features = ["html"] }
syntect = "5"
ureq = "2"
regex = "1"
sha2 = "0.10"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-web-kit = "0.3"
objc2-core-graphics = "0.3"
objc2-core-foundation = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
security-framework = "3"
notify = "8"

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"

[profile.release]
lto = true
strip = true
