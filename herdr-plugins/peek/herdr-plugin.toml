id = "nyjin.peek"
name = "peek"
version = "0.5.0"
min_herdr_version = "0.9.3"
description = "Click a path or a Jira, Confluence or GitHub PR link in a Claude Code pane to read it, rendered by WebKit, in the pane beside it"
platforms = ["macos"]

# The viewer runs from the plugin root by absolute path: the pane's cwd is the source pane's folder.
[[panes]]
id = "viewer"
title = "peek"
placement = "split"
command = ["sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/peek\" viewer"]

[[actions]]
id = "open-link"
title = "peek: open the clicked path or link"
command = ["bin/peek", "link"]

# One action per viewer command (src/link.rs ACTIONS), so each can be bound to a key; from the viewer pane or its
# Claude pane.
[[actions]]
id = "toggle-view"
title = "peek: toggle rendered/source"
contexts = ["pane"]
command = ["bin/peek", "action", "toggle"]

[[actions]]
id = "reload"
title = "peek: reload"
contexts = ["pane"]
command = ["bin/peek", "action", "reload"]

[[actions]]
id = "find"
title = "peek: find in the document"
contexts = ["pane"]
command = ["bin/peek", "action", "find"]

[[actions]]
id = "zoom-in"
title = "peek: zoom in"
contexts = ["pane"]
command = ["bin/peek", "action", "zoom-in"]

[[actions]]
id = "zoom-out"
title = "peek: zoom out"
contexts = ["pane"]
command = ["bin/peek", "action", "zoom-out"]

[[actions]]
id = "zoom-reset"
title = "peek: reset zoom"
contexts = ["pane"]
command = ["bin/peek", "action", "zoom-reset"]

[[actions]]
id = "screenshot"
title = "peek: screenshot"
contexts = ["pane"]
command = ["bin/peek", "action", "screenshot"]

[[actions]]
id = "browser"
title = "peek: open in browser"
contexts = ["pane"]
command = ["bin/peek", "action", "browser"]

[[actions]]
id = "back"
title = "peek: back"
contexts = ["pane"]
command = ["bin/peek", "action", "back"]

[[link_handlers]]
id = "markdown"
title = "Open in peek"
pattern = '(?i)[^\s]*\.(md|markdown)\b(:\d+){0,2}'
action = "open-link"

[[link_handlers]]
id = "source"
title = "Open in peek (source)"
pattern = '[^\s]*\.(py|java|kt|kts|ts|tsx|js|jsx|go|rs|sh|sql|ya?ml|toml|json|xml|gradle|rb|swift|c|h|cpp|hpp)\b(:\d+){0,2}'
action = "open-link"

[[link_handlers]]
id = "page"
title = "Open in peek (page or image)"
pattern = '(?i)[^\s]*\.(html?|png|jpe?g|gif|webp|svg)\b'
action = "open-link"

[[link_handlers]]
id = "jira"
title = "Open Jira issue in peek"
pattern = 'https://[^/\s]+\.atlassian\.net/browse/[A-Z][A-Z0-9]+-\d+'
action = "open-link"

[[link_handlers]]
id = "confluence"
title = "Open Confluence page in peek"
pattern = 'https://[^/\s]+\.atlassian\.net/wiki/\S+'
action = "open-link"

[[link_handlers]]
id = "github-pr"
title = "Open GitHub PR in peek"
pattern = 'https://github\.com/[^/\s]+/[^/\s]+/pull/\d+'
action = "open-link"
